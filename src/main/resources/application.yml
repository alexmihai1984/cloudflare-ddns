spring.application.name: cloudflare-ddns

logging:
  file.name: /var/log/cloudflare-ddns/cloudflare-ddns.log
  logback.rollingpolicy:
    max-file-size: 100MB
    max-history: 10

spring.cloud.openfeign.okhttp.enabled: true

scheduler:
  interval:
    seconds: 30

ip-providers:
  providers:
    - name: aws
      url: https://checkip.amazonaws.com
      type: plain_text
    - name: icanhazip
      url: https://icanhazip.com
      type: plain_text
    - name: ipify
      url: https://api.ipify.org
      type: plain_text
    - name: cloudflare
      url: https://1.1.1.1/cdn-cgi/trace
      type: cloudflare_trace
    - name: cloudflare_backup
      url: https://1.0.0.1/cdn-cgi/trace
      type: cloudflare_trace

cloudflare:
  api:
    root_url: https://api.cloudflare.com/client/v4/
    get_dns_records_path: /zones/{zone_id}/dns_records
    patch_record_path: /zones/{zone_id}/dns_records/{dns_record_id}
    token: api_token
    per_page: 100
  zones:
    - id: zone_id
      token: api_token
      domains:
        - yourdomain.com
        - api.yourdomain.com
